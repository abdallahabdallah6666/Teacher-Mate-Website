name: Release readiness - website

on:
  pull_request:
    branches: [main]
  push:
    branches: [release-readiness/credential-proxy-2026-10]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run lint
      - name: Build
        run: bun run build
